<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spot it!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script defer src="./app.js"></script>
    
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        
        <section id="start-screen">
            <h1>Spot it!</h1>
            <p>Find all the differences before time runs out</p>
            <button id="start-button"class="start">Start game</button>

        </section>
   
    
       <section id="difficulty-screen">

    <h3 class="mini-logo">Spot it! 🎮</h3>
    <h2>Choose Difficulty</h2>

    <div class="difficulty-options">

        <div class="level">
            <button id="easy-button" class="difficulty-button easy">
                Easy
            </button>
            <p>Find 3 differences</p>
        </div>


        <div class="level">
            <button id="medium-button" class="difficulty-button medium">
                Medium
            </button>
            <p>Find 5 differences</p>
        </div>


        <div class="level">
            <button id="hard-button" class="difficulty-button hard">
                Hard
            </button>
            <p>Find more differences</p>
        </div>

    </div>

</section>

        <section id="game-screen">
            <h3 class="mini-logo">Spot it! 🎮</h3>
            <p id="level-name"></p>


<div class="game-info">

    <div class="info-card">
        <span>⏱️ Time</span>
        <strong id="timer">60</strong>
    </div>

    <div class="info-card">
        <span>⭐ Score</span>
        <strong id="score">0</strong>
    </div>

    <div class="info-card">
        <span>🎯 Left</span>
        <strong id="differences-left">3</strong>
    </div>

</div>

    <div id="original-container">
    <img src="./imges/easy one.png" alt="Original image" id="original-image">
</div>

<div id="changed-container">
    <img src="./imges/easy two.png" alt="Changed image" id="changed-image">

    <div id="grid-container"></div>
</div>

    

    <button id="back-button" class="back-button">
    Back

    
</button>
</section>

<section id="result-screen">
<h3 class="mini-logo">Spot it! 🎮</h3>
    <h2 id="result-message"></h2>
      <div id="result-icon"></div>
     <p id="final-score"></p>

    <button id="restart-button" class="restart-button">
        Play Again
    </button>

</section>
 </main>
    

</body>
</html>
